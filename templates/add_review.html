<!DOCTYPE html>
<html>
<head>
    <title>Add Review</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Write a Product Review</h1>
        <p>Share your experience with the product</p>
    </header>

    <div class="container">

        <form action="/add_review" method="POST">

            <label>Your Name</label><br>
            <input type="text" name="name" placeholder="Enter your name" required>

            <br><br>

            <label>Product Name</label><br>
            <input type="text" name="product" placeholder="Enter product name" required>

            <br><br>

            <label>Rating</label><br>
            <select name="rating" required>
                <option value="">Select Rating</option>
                <option value="5">⭐⭐⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
                <option value="2">⭐⭐</option>
                <option value="1">⭐</option>
            </select>

            <br><br>

            <label>Your Review</label><br>
            <textarea name="review" rows="5" placeholder="Write your review..." required></textarea>

            <br><br>

            <button type="submit">Submit Review</button>

        </form>

        <br>

        <a href="/">← Back to Home</a>

    </div>

</body>
</html>
